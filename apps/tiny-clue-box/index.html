<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b766e"><meta name="description" content="輪流挑一個身邊物品，用三條線索讓對方猜，練習觀察與表達。"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>三條線索猜猜看</title></head><body><main class="shell"><header><a class="back" href="../../">← 回到工具合集</a><p class="eyebrow">5–10 分鐘・兩人輪流・低音量</p><h1>🧰 三條線索猜猜看</h1><p class="intro">出題員挑一個身邊看得到的東西，不說名字；猜題員聽三條線索來找答案。</p></header><section class="progress" aria-label="遊戲進度"><span id="round-label">第 1 回合，共 5 回合</span><span id="role-label">出題員：玩家 1</span></section><section class="game-card" aria-live="polite"><div id="choose-stage"><p class="step">出題員先看</p><span class="big-emoji" id="card-emoji">🔴</span><h2 id="card-title">找一個有顏色的東西</h2><p id="card-hint">選好後記住它，不要說出名字。</p><button id="ready-button" class="primary">我選好了，藏起題目</button></div><div id="clue-stage" hidden><p class="step">一次說一條線索</p><div class="clue-list" id="clue-list"></div><button id="next-clue" class="primary">顯示第 1 條線索</button><button id="solved-button" class="success">猜到了！下一回合</button></div><div id="finish-stage" hidden><span class="big-emoji">🎉</span><h2>五回合完成！</h2><p>你們一共交換了 15 條觀察線索。</p><button id="restart-button" class="primary">再玩一次</button></div></section><section class="how-to"><h2>怎麼玩</h2><ol><li><strong>偷偷選：</strong>照卡片提示，挑一個附近看得到的東西。</li><li><strong>慢慢說：</strong>把手機交給猜題員，每按一次就出現一個線索方向。</li><li><strong>交換角色：</strong>猜到或三條線索說完，就按「下一回合」。</li></ol><p class="tip">找不到也可以換卡；搭車時只觀察車內，請不要解開安全帶。</p><button id="new-card" class="text-button">這題不適合，換一張</button><button id="reset-button" class="text-button">重新開始</button></section></main><script src="./app.js"></script></body></html>
