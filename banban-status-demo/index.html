<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2d"><title>班班｜狀態面板</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div class="eyebrow">BANBAN · INTERACTIVE DEMO</div><h1>班班狀態面板</h1><p class="demo-banner">展示模式：以下為虛構範例，不連結真實家庭提醒或主機資料。</p><p id="stamp">載入範例中…</p></header><div id="alerts" class="alerts" role="status" aria-live="polite"></div><section class="hero"><div><small>目前執行</small><strong id="running-count">—</strong></div><div><small>今日排程</small><strong id="today-count">—</strong></div><div><small>待觸發</small><strong id="upcoming-count">—</strong></div></section><section><div class="heading"><h2>現在在忙什麼</h2><span class="hint">範例狀態</span></div><div id="work" class="list"></div></section><section><div class="heading"><h2>今天的時間軸</h2><div class="filters"><button type="button" data-filter="notification" class="selected">通知</button><button type="button" data-filter="all">全部</button></div></div><p class="hint">「可能提醒」會先檢查條件；排程觸發不代表已送達或已完成。</p><div id="timeline" class="list"></div></section><section><details><summary>已暫停的工作 <span id="paused-count"></span></summary><div id="paused" class="list"></div></details></section><footer>展示模式 · 虛構範例資料<br><span id="error"></span></footer></main><script src="./app.js" defer></script></body></html>
